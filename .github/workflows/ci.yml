# CI workflow for web-terminal
#
# NOTE: This workflow runs on windows-latest because node-pty uses native ConPTY
# bindings. node-pty 1.x ships win32-x64 prebuilds so no node-gyp/MSVC step is
# needed — npm ci alone is sufficient.
#
# The Playwright config (playwright.config.js) has a `webServer` block that
# starts `node server.js` automatically before the test suite, so no separate
# "start server" step is required. Credentials and port are injected via the
# env vars WT_TEST / WT_USER / WT_PASS / WT_PORT / WT_SPAWN_WORKER defined in
# playwright.config.js. config.test.json is gitignored but the server falls
# back gracefully to env vars when the file is absent, which is the correct
# behaviour for CI.
#
# Things we could not fully verify in a live CI run:
# - Whether Windows Server (the OS under windows-latest) exposes a functional
#   ConPTY API to the test runner; if not, PTY-dependent tests may time out.
#   The server is configured to use the bundled OpenConsole.exe (useConptyDll),
#   which reduces exposure to host-OS ConPTY issues.
# - playwright install --with-deps is documented as a no-op on Windows (deps
#   are bundled in the Chromium download), but we include it for correctness.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual re-run. Worth having because this suite drives real PTYs on a hosted
  # Windows runner: a failure can be an environment flake (ConPTY availability)
  # rather than a code fault, and telling those apart means re-running the same
  # commit rather than pushing a no-op to provoke a fresh run.
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, Windows)
    # Only build when the repo is PUBLIC (Actions is free for public repos).
    # On a private repo this skips with zero runner minutes, so CI never
    # bills against the Actions quota — windows-latest costs 2x minutes.
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest
    continue-on-error: false

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        # node-pty 1.x ships win32-x64 prebuilds; no native build tools needed.
        run: npm ci

      - name: Install Playwright browsers
        # --with-deps is a no-op on Windows (dependencies are bundled), but
        # including it avoids confusion if the flag behaviour changes.
        run: npx playwright install --with-deps chromium

      - name: Syntax check
        run: node -c server.js && node -c monitor.js && node -c pty-worker.js

      - name: Lint
        # eslint.config.js downgrades domain-intentional rules to warnings; the
        # gate fails only on real errors. Warnings are surfaced but non-blocking.
        run: npx eslint .

      - name: Run tests
        # The webServer block in playwright.config.js starts node server.js
        # automatically on port 17681 with WT_TEST=1 / WT_SPAWN_WORKER=1.
        # No config.json or pre-existing server is required.
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  companion-windows:
    name: Companion (Windows desktop link)
    # WHY THIS JOB EXISTS
    #
    # The Windows desktop build broke on ~2026-08-06 and nobody noticed until
    # 2026-08-22, because NOTHING built it. `flutter test` (in pr-checks.yml)
    # compiles Dart and never invokes MSVC, so it cannot see a NATIVE link
    # failure — and the failure was exactly that: firebase_core drags a prebuilt
    # firebase_app.lib into the link, and from Firebase C++ SDK 12.7.0 on those
    # binaries call MSVC STL helpers that older toolsets do not export (#158).
    #
    # A Dart-only gate is structurally blind to that whole class of fault. This
    # job is the smallest thing that is not: it performs the real link.
    #
    # It deliberately does NOT run the app or build the APK. Android is covered
    # by `flutter test` plus the fact that the Play/adb path is exercised on
    # every release; the uncovered surface was specifically the native link, so
    # that is what this gates.
    #
    # Same public-repo guard as the suite above: windows-latest bills 2x
    # minutes, so on a private repo this skips with zero runner cost.
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Seed the gitignored spike_config
        # lib/spike_config.dart holds server URLs and bearer tokens, so it is
        # gitignored — a FRESH CLONE cannot compile the companion without this.
        # Same step as the Dart suite in pr-checks.yml; `cp` is a Copy-Item
        # alias under the pwsh default shell on windows-latest.
        working-directory: ai-terminal
        run: cp lib/spike_config.example.dart lib/spike_config.dart

      - name: Build the Windows desktop release
        # The link step is the point of the whole job. A compile-only check
        # would pass against the very defect this exists to catch.
        working-directory: ai-terminal
        run: flutter build windows --release

      - name: Prove the executable was actually produced
        # `flutter build` has exited 0 while producing no binary before now, so
        # assert on the artifact rather than on the exit code.
        working-directory: ai-terminal
        run: |
          if (-not (Test-Path 'build/windows/x64/runner/Release/ai_terminal.exe')) {
            Write-Error 'ai_terminal.exe was not produced despite a zero exit code'
            exit 1
          }
          Get-Item 'build/windows/x64/runner/Release/ai_terminal.exe' | Select-Object Name, Length, LastWriteTime
