# Fast PR gate — the checks a reviewer should never have to do by hand.
#
# WHY THIS IS SEPARATE FROM ci.yml. The full suite runs on windows-latest because
# it drives real PTYs; it takes ~8 minutes and bills at 2x. These checks need
# neither Windows nor a PTY, so they run on ubuntu in about a minute at 1x. Split
# that way, a PR gets an answer to "is this even reviewable?" almost immediately,
# and the expensive Windows run is the second opinion rather than the only one.
#
# Everything here is deterministic: no PTY, no browser, no network beyond npm.
# A red result is a real defect in the change, never an environment flake — which
# is the whole point, because a gate people learn to ignore is not a gate.

name: PR Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The secrets scan and the version-bump check both diff against the
          # base branch, so the history has to be there. fetch-depth: 0 is the
          # simple correct answer; a shallow clone makes `git diff base...HEAD`
          # fail in a way that looks like "no changes" rather than an error.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node -c server.js && node -c monitor.js && node -c pty-worker.js

      - name: Lint
        run: npx eslint .

      - name: Documentation links
        run: node scripts/check-links.js

      - name: No secrets or machine-identifying data
        run: node scripts/check-no-secrets.js

      - name: SERVER_VERSION bumped
        if: github.event_name == 'pull_request'
        run: |
          base=$(git show origin/${{ github.base_ref }}:server.js | grep -oP "SERVER_VERSION = '\K[0-9.]+" | head -1)
          head=$(grep -oP "SERVER_VERSION = '\K[0-9.]+" server.js | head -1)
          echo "base=$base  head=$head"
          if [ "$base" = "$head" ]; then
            echo "::error::SERVER_VERSION is still $head. Bump it — patch for a fix, minor for a feature, major for a break. A PR without a bump cannot be deployed or rolled back cleanly."
            exit 1
          fi
          echo "OK — $base -> $head"

      - name: Companion app tests
        # The Dart suite is fast, hermetic and needs no PTY, so it belongs in the
        # quick gate rather than behind the Windows run. Firebase is Android-only
        # and never touched by `flutter test`.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter test
        working-directory: ai-terminal
        run: flutter test
