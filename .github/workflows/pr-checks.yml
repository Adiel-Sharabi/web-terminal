# Fast PR gate — the checks a reviewer should never have to do by hand.
#
# WHY THIS IS SEPARATE FROM ci.yml. The full suite runs on windows-latest because
# it drives real PTYs; it takes ~8 minutes and bills at 2x. These checks need
# neither Windows nor a PTY, so they run on ubuntu in about a minute at 1x. Split
# that way, a PR gets an answer to "is this even reviewable?" almost immediately,
# and the expensive Windows run is the second opinion rather than the only one.
#
# Everything here is deterministic: no PTY, no browser, no network beyond npm.
# A red result is a real defect in the change, never an environment flake — which
# is the whole point, because a gate people learn to ignore is not a gate.

name: PR Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The secrets scan and the version-bump check both diff against the
          # base branch, so the history has to be there. fetch-depth: 0 is the
          # simple correct answer; a shallow clone makes `git diff base...HEAD`
          # fail in a way that looks like "no changes" rather than an error.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node -c server.js && node -c monitor.js && node -c pty-worker.js

      - name: Lint
        run: npx eslint .

      - name: Documentation links
        run: node scripts/check-links.js

      - name: No secrets or machine-identifying data
        run: node scripts/check-no-secrets.js

      - name: Shared constants agree across both clients
        # app.html and the companion cannot import from one another, so a handful
        # of values are genuinely defined twice. This is what stops one copy from
        # being re-tuned alone — the #165 headroom thresholds are marked
        # PROVISIONAL in both files and openly invite a re-tune, which is exactly
        # the edit that would otherwise drift silently.
        run: node scripts/check-shared-constants.js

      - name: Version bumped for what changed
        # WHY THIS IS PER-AREA. The gate protects one property: a released
        # artifact must be identifiable, so it can be deployed and rolled back
        # cleanly. This repo ships TWO artifacts — the server (SERVER_VERSION in
        # server.js) and the companion app (version in ai-terminal/pubspec.yaml)
        # — and this check used to demand a SERVER_VERSION bump from every PR,
        # including one touching only the companion. That is wrong in both
        # directions at once: it forces a server version whose server bytes are
        # byte-identical to the previous one (destroying the very identity the
        # gate exists to protect), while never checking the version of the thing
        # the PR actually changed. First hit by #100, a companion-only fix —
        # and it would have blocked every companion-only PR from then on.
        #
        # Anything outside ai-terminal/ still requires a SERVER_VERSION bump,
        # docs and CI config included. That is deliberate: the alternative is a
        # hand-maintained list of "paths in neither artifact", and such a list
        # rots silently until the day it lets a real server change through
        # unbumped.
        if: github.event_name == 'pull_request'
        run: |
          base_ref="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base_ref"...HEAD)
          echo "changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'

          companion=0; other=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              ai-terminal/*) companion=1 ;;
              *)             other=1 ;;
            esac
          done <<< "$changed"

          fail=0

          if [ "$other" = "1" ]; then
            b=$(git show "$base_ref":server.js | grep -oP "SERVER_VERSION = '\K[0-9.]+" | head -1)
            h=$(grep -oP "SERVER_VERSION = '\K[0-9.]+" server.js | head -1)
            if [ -z "$b" ] || [ -z "$h" ]; then
              # An empty capture must FAIL, never pass. If the version line's
              # shape drifts on HEAD only, the regex stops matching there, `h`
              # is empty, "$b" != "$h" is true — and the gate would print a
              # cheerful "OK — 1.2.3 -> " and go green while HEAD carries no
              # readable version at all. A gate that can pass silently is not a
              # gate.
              echo "::error::could not read SERVER_VERSION (base='$b' head='$h'). The version line's format changed — fix the line or this gate."
              fail=1
            elif [ "$b" = "$h" ]; then
              echo "::error::SERVER_VERSION is still $h. Bump it — patch for a fix, minor for a feature, major for a break. A PR without a bump cannot be deployed or rolled back cleanly."
              fail=1
            else
              echo "OK — server $b -> $h"
            fi

            # #200 Finding 3 — this line's shape is `const SERVER_VERSION = '<ver>';
            # // <changelog>`: the VALUE is six-ish characters, the entire release
            # history lives in the TRAILING COMMENT (each entry prepends its own
            # note and keeps every prior one as `Prior <oldver>: <old comment>`).
            # That makes the line append-only by construction — it can grow, it can
            # stay the same length only when nothing changed, but it can never
            # legitimately get SHORTER. A PR once deleted 88 accumulated entries
            # (346,209 -> 1,123 chars) while still bumping the version string, and
            # the check above — which only compares the version VALUE — went green.
            #
            # #226 — MEASURED FROM THE MERGE BASE, NOT FROM THE BASE TIP, and that
            # distinction is the whole fix. The question this check means to ask is
            # "did THIS BRANCH delete accumulated history?" — a property of the
            # branch's own edit, so its baseline is the commit the branch forked
            # from. Resolved against the base tip it instead asked "is this line
            # shorter than master's is RIGHT NOW", which a correctly-appending branch
            # fails the moment another PR merges ahead of it: master grew, the branch
            # did not. Reproduced on a scratch clone of this repo — two branches each
            # prepending one entry, the longer one merged first:
            #
            #   base tip:   b_len=377891 h_len=377787  -> RED, "SHRANK ... Restore the
            #                                            prior history"  (FALSE, and the
            #                                            wrong cause named confidently)
            #   merge base: b_len=377754 h_len=377787  -> green (the branch appended)
            #   a genuine wipe, under merge base: 377891 -> 55  -> still RED
            #
            # Someone who trusts the false message and "restores the prior history"
            # onto an already-correct branch produces a genuinely mangled line — the
            # gate causing the damage it exists to prevent.
            #
            # THE TRAP, stated because the obvious tidy-up is wrong: `b` above — the
            # version VALUE — must stay on the BASE TIP. It answers a different
            # question ("is this version distinguishable from what is already
            # released?"), which is a property of the branch relative to master NOW.
            # Two PRs both bumping 1.73.2 -> 1.73.3, the first merged: against the tip
            # that is 1.73.3 vs 1.73.3 and correctly red; against the merge base it is
            # 1.73.2 vs 1.73.3 and a version collision ships. That is the recorded
            # "three open PRs all claimed the same SERVER_VERSION" case. Two checks
            # sharing a `git show` expression is not evidence they share a baseline.
            #
            # The stale-branch risk this no longer notices — a branch merging over
            # newer entries — needs no check of its own: it is a same-line edit on
            # both sides, so git conflicts. Measured on the same scratch clone,
            # merging the stale branch: "CONFLICT (content): Merge conflict in
            # server.js". GitHub blocks it; nothing is silently overwritten.
            merge_base=$(git merge-base "$base_ref" HEAD)
            b_len=$(git show "$merge_base":server.js | awk '/^const SERVER_VERSION = /{print length($0); exit}')
            h_len=$(awk '/^const SERVER_VERSION = /{print length($0); exit}' server.js)
            if [ -z "$merge_base" ]; then
              echo "::error::could not resolve the merge base of $base_ref and HEAD. fetch-depth: 0 is set above — if that changed, this gate cannot measure anything."
              fail=1
            elif [ -z "$b_len" ] || [ -z "$h_len" ]; then
              echo "::error::could not find or measure server.js's SERVER_VERSION line (fork point=$b_len head=$h_len chars)."
              fail=1
            elif [ "$h_len" -lt "$b_len" ]; then
              echo "::error::server.js's SERVER_VERSION line SHRANK from $b_len to $h_len characters since this branch forked ($merge_base). The SERVER_VERSION changelog lives in that line's trailing comment, not the version string literal — the line is append-only and must never get shorter. Restore the prior history (git show $merge_base:server.js) and PREPEND your new note, keeping the rest in the established 'Prior <oldver>: <old comment>' form."
              fail=1
            elif [ "$h_len" = "$b_len" ] && [ "$b" != "$h" ]; then
              # Still exactly right under the merge-base baseline, and slightly
              # sharper for it: the branch bumped the version but did not lengthen
              # the line RELATIVE TO ITS OWN FORK POINT, so it prepended nothing.
              echo "::error::SERVER_VERSION changed ($b -> $h) but its line length didn't move since this branch forked ($h_len chars). A real bump adds a dated note to the trailing comment, which makes the line strictly longer — an unchanged length here means the changelog wasn't actually extended."
              fail=1
            fi
          fi

          if [ "$companion" = "1" ]; then
            b=$(git show "$base_ref":ai-terminal/pubspec.yaml | grep -oP '^version:\s*\K\S+' | head -1)
            h=$(grep -oP '^version:\s*\K\S+' ai-terminal/pubspec.yaml | head -1)
            if [ -z "$b" ] || [ -z "$h" ]; then
              echo "::error::could not read the companion version from ai-terminal/pubspec.yaml (base='$b' head='$h'). Fix the version line or this gate."
              fail=1
            elif [ "$b" = "$h" ]; then
              echo "::error::ai-terminal/pubspec.yaml version is still $h. Bump it — the companion is a separately released artifact, and an unbumped build cannot be told apart from the one before it on a device."
              fail=1
            else
              echo "OK — companion $b -> $h"
            fi
          fi

          exit $fail

      - name: Companion app tests
        # The Dart suite is fast, hermetic and needs no PTY, so it belongs in the
        # quick gate rather than behind the Windows run. Firebase is Android-only
        # and never touched by `flutter test`.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Seed the gitignored spike_config
        # lib/spike_config.dart holds server URLs and bearer tokens, so it is
        # gitignored — which means a FRESH CLONE cannot compile the companion at
        # all, CI included. The committed template has empty values, which
        # server_store.dart treats as "no seed servers" rather than as an error.
        working-directory: ai-terminal
        run: cp lib/spike_config.example.dart lib/spike_config.dart

      - name: flutter test
        working-directory: ai-terminal
        run: flutter test
