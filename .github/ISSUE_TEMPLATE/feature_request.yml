name: Feature Request
description: Suggest a new feature or enhancement for web-terminal.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to web-terminal!
        Before submitting, please search existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: |
        What problem does this feature solve? What use-case or workflow does it enable?
        Describe it from a user perspective ("As a user who … I want … so that …").
      placeholder: Describe the problem or motivation...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        Describe the feature you would like to see. Be as specific as possible —
        UI changes, API additions, config options, etc.
      placeholder: Describe your proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Have you tried any workarounds or considered other approaches?
        Why are they insufficient?
      placeholder: Describe alternatives you have considered...

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Any other context, mockups, or references that would help explain the request.
