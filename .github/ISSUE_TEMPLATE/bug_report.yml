name: Bug Report
description: Report a bug or unexpected behaviour in web-terminal.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

        > **Security vulnerabilities must NOT be filed here.**
        > Please read [SECURITY.md](../SECURITY.md) and follow the responsible disclosure process instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the issue.
      placeholder: |
        1. Open the terminal at /
        2. Create a new session
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Host OS
      description: The OS where the web-terminal server is running.
      options:
        - Windows 11
        - Windows 10
        - Windows Server 2022
        - Windows Server 2019
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "e.g. v20.11.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if UI issue)
      description: Browser name and version where the problem was observed.
      placeholder: "e.g. Chrome 124, Firefox 125, Safari 17"

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: |
        Check the footer of the web UI, or call `GET /api/version` (visible as `SERVER_VERSION` in the response).
      placeholder: "e.g. 1.14.6"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: |
        Paste any relevant server logs (from `logs/`) or browser console errors.
        Wrap long output in triple-backtick code fences.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — screenshots, config snippets (with secrets removed), etc.
